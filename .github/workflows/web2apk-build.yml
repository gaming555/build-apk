name: Web to APK Build
run-name: Web to APK - ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Website URL to display in the Android WebView app
        required: true
        type: string
      app_name:
        description: Application display name
        required: true
        type: string
      icon_url:
        description: HTTPS icon URL
        required: true
        type: string
      request_id:
        description: Unique dispatch identifier
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: web2apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android WebView project
        env:
          WEB_URL: ${{ inputs.web_url }}
          APP_NAME: ${{ inputs.app_name }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/xyro/webapk app/src/main/res/drawable-nodpi
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
          curl --fail --location --retry 3 "$ICON_URL" -o icon.png
          file icon.png | grep -qi 'PNG image data'
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp icon.png "app/src/main/res/mipmap-${density}/ic_launcher.png"; done
          cp icon.png app/src/main/res/drawable-nodpi/app_icon.png
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'WebToApk'
          include ':app'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          GRADLE
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.xyro.webapk'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.xyro.webapk'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="false" android:usesCleartextTraffic="true" android:label="${APP_LABEL}" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          python3 - <<'PY'
          import os, html
          p='app/src/main/AndroidManifest.xml'
          s=open(p).read().replace('${APP_LABEL}', html.escape(os.environ.get('APP_NAME','Web App')))
          open(p,'w').write(s)
          PY
          cat > app/src/main/java/com/xyro/webapk/MainActivity.java <<'JAVA'
          package com.xyro.webapk;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  webView.loadUrl(new String(android.util.Base64.decode(BuildConfig.WEB_URL_B64, android.util.Base64.DEFAULT)));
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA
          python3 - <<'PY'
          import os
          p='app/build.gradle'
          s=open(p).read()
          import base64
          url=base64.b64encode(os.environ['WEB_URL'].encode()).decode()
          s=s.replace("versionName '1.0'", "versionName '1.0'\n                  buildConfigField 'String', 'WEB_URL_B64', \"'" + url + "'\"")
          s=s.replace('defaultConfig {', 'buildFeatures { buildConfig true }\n              defaultConfig {')
          open(p,'w').write(s)
          PY

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-build
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1
